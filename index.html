<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish Good Analysis</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--k:#111;--g:#c9a227;--g2:#f5d76e;--bg:#fffdf6;--ln:#ddd5bd}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--k);padding-bottom:40px}
header{background:linear-gradient(90deg,#111,#c9a227);color:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px}.brand img{width:36px;height:36px;border-radius:8px}h1{font-size:18px;margin:0;letter-spacing:.5px}
h2{font-size:17px;margin:18px 0 4px}.hint{margin:0 0 8px;color:#6b6347;font-size:13px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--k);background:#fff;color:var(--k);padding:10px 14px;border-radius:8px;cursor:pointer;display:inline-block}
button.main{background:linear-gradient(90deg,#111,#b8891a);color:#fff;border:0}button.ghost{background:transparent;color:inherit;border-color:currentColor}
button:disabled{opacity:.45}header button{background:rgba(255,255,255,.12);color:#fff;border-color:#fff8}
.info{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid var(--ln)}.info label{flex:1;min-width:110px;font-size:12px;color:#6b6347}
input{font:inherit;width:100%;padding:8px;border:1px solid var(--ln);border-radius:6px;background:#fff}
nav{display:flex;border-bottom:2px solid var(--k)}nav button{flex:1;border:0;border-radius:0;background:transparent;padding:12px 4px;font-size:14px}nav .on{background:var(--k);color:var(--g2)}
main{padding:12px;max-width:1000px;margin:auto}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
#pv{max-width:100%;max-height:320px;border:1px solid var(--ln);border-radius:8px;display:block;margin:auto}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{border:1px solid var(--ln);padding:3px;text-align:center}
th{background:var(--k);color:var(--g2);padding:8px;font-size:14px}td input{border:0;text-align:center;font-weight:600;min-width:70px;padding:8px 4px;background:transparent}
input.warn{background:#fff3b0}.shift h3{margin:18px 0 6px;padding:8px 12px;background:linear-gradient(90deg,#111,#c9a227);color:#fff;border-radius:6px}
.st{margin:8px 0;font-size:14px}.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#111,#c9a227)}
#prev canvas{width:100%;border:1px solid var(--ln);margin:8px 0;background:#fff}
dialog{width:min(560px,94vw);border:2px solid var(--k);border-radius:10px;padding:14px}dialog::backdrop{background:#0008}
.sr{display:grid;grid-template-columns:auto 1fr 70px auto auto auto;gap:4px;align-items:center;margin:6px 0}.sr button{padding:6px 9px}
.ico{width:36px;height:36px}

#ocrT{table-layout:fixed;min-width:0;width:100%}#ocrT th:first-child{width:46px}#ocrT td input{min-width:0;width:100%}
.ver{font-size:11px;opacity:.85;display:block}

</style>
</head><body>
<header>
 <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>FINISH GOOD ANALYSIS</h1><small class="ver">versi 2.2 · OCR per sel</small></div></div>
 <div class="top"><button id="bSet">⚙ Pengaturan</button><button id="bClear" class="ghost">KOSONGKAN DATA</button></div>
</header>
<div class="info">
 <label>Hari<input id="iDay" placeholder="Kamis"></label>
 <label>Tanggal<input id="iDate" placeholder="26.11.2026"></label>
 <label>No. Jadwal<input id="iNo" placeholder="274"></label>
</div>
<nav><button data-v="ocr" class="on">1. Foto &amp; OCR</button><button data-v="book">2. Buku Digital</button><button data-v="exp">3. Ekspor</button></nav>
<main>
<section id="v-ocr">
 <div class="row">
  <label class="btn">📁 Galeri<input type="file" id="fGal" accept="image/*" hidden></label>
  <label class="btn">📷 Kamera<input type="file" id="fCam" accept="image/*" capture="environment" hidden></label>
 </div>
 <img id="pv" alt="Preview foto" hidden>
 <div class="row"><button id="bGo" class="main" disabled>PROSES FOTO</button></div>
 <div id="st" class="st" hidden><div class="bar"><i id="pb"></i></div><span id="stt"></span></div>
 <h2>Hasil pembacaan (bisa diedit)</h2>
 <p class="hint">Sel kuning = OCR kurang yakin, periksa. Dua flavour dalam satu sel ditulis dengan tanda /</p>
 <div class="sc"><table id="ocrT"><thead><tr><th>Line</th><th>Shift 1</th><th>Shift 2</th><th>Shift 3</th></tr></thead><tbody></tbody></table></div>
 <div class="row">
  <button id="bRe">PROSES ULANG OCR</button><button id="bFix">KOREKSI DATA</button>
  <button id="bUse" class="main">GUNAKAN DATA</button><button id="bEmpty" class="ghost">KOSONGKAN HASIL</button>
 </div>
</section>
<section id="v-book" hidden><div id="bookBox"></div></section>
<section id="v-exp" hidden>
 <div class="row"><button id="bPng" class="main">Ekspor PNG</button><button id="bPdf" class="main">Ekspor PDF</button><button id="bPrint">Cetak</button><button id="bShare">Bagikan ke WhatsApp</button></div>
 <div id="prev"></div>
</section>
</main>
<dialog id="dSet"><h2>Pengaturan kolom</h2><div id="setBox"></div>
 <div class="row"><button id="bAdd">+ Tambah kolom</button><button id="bSetOk" class="main">Simpan</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),KEY='fga_v1';
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
const emptyOcr=()=>Array.from({length:11},(_,i)=>({n:i+1,s:[0,1,2].map(()=>({t:'',u:0}))}));
const fresh=()=>({cfg:{lt:'Line',ft:'Flavour',cols:[{id:'c1',t:'Kolom 1',d:'-',on:1},{id:'c2',t:'Kolom 2',d:'8',on:1},{id:'c3',t:'Manual 1',d:'',on:1},{id:'c4',t:'Manual 2',d:'',on:1}]},info:{day:'',date:'',no:''},ocr:emptyOcr(),book:[[],[],[]]});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vis=()=>S.cfg.cols.filter(c=>c.on);

/* ---------- Tab & info ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 ['ocr','book','exp'].forEach(v=>$('#v-'+v).hidden=v!==b.dataset.v);
 if(b.dataset.v==='book')rBook();if(b.dataset.v==='exp')rPrev()});
[['iDay','day'],['iDate','date'],['iNo','no']].forEach(([id,k])=>{$('#'+id).value=S.info[k];$('#'+id).oninput=e=>{S.info[k]=e.target.value;save()}});

/* ---------- Tabel hasil OCR ---------- */
function rOcr(){$('#ocrT tbody').innerHTML=S.ocr.map((r,i)=>`<tr><th>${r.n}</th>${r.s.map((c,j)=>`<td><input data-i="${i}" data-j="${j}" class="${c.u?'warn':''}" value="${esc(c.t)}" placeholder="-"></td>`).join('')}</tr>`).join('')}
$('#ocrT').oninput=e=>{const t=e.target;if(t.dataset.i==null)return;const c=S.ocr[t.dataset.i].s[t.dataset.j];c.t=t.value.toUpperCase();c.u=0;t.classList.remove('warn');save()};
$('#bFix').onclick=()=>{const w=document.querySelector('#ocrT input.warn')||document.querySelector('#ocrT input');w.scrollIntoView({block:'center'});w.focus()};
$('#bEmpty').onclick=()=>{S.ocr=emptyOcr();save();rOcr()};
$('#bUse').onclick=()=>{
 S.book=[0,1,2].map(s=>S.ocr.filter(r=>r.s[s].t.trim()).map(r=>{const f=r.s[s].t.trim(),n=f.split('/').length,v={};
  S.cfg.cols.forEach(c=>v[c.id]=c.d===''?'':Array(n).fill(c.d).join('/'));return{n:r.n,f,v}}));
 save();document.querySelector('nav [data-v=book]').click()};

/* ---------- Foto ---------- */
let img=null;
function pick(f){if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;$('#pv').src=u;$('#pv').hidden=false;$('#bGo').disabled=false};im.src=u}
$('#fGal').onchange=e=>pick(e.target.files[0]);$('#fCam').onchange=e=>pick(e.target.files[0]);
$('#bGo').onclick=$('#bRe').onclick=()=>img?runOCR():alert('Pilih foto dulu.');
const stat=(p,t)=>{$('#st').hidden=false;$('#pb').style.width=Math.round(p*100)+'%';$('#stt').textContent=t};

function prep(im){
 /* skala, abu-abu, binarisasi adaptif (tahan bayangan), lalu hapus garis tabel agar OCR tidak terganggu */
 const W=Math.min(3000,Math.max(2000,im.naturalWidth)),H=Math.round(im.naturalHeight*W/im.naturalWidth);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(im,0,0,W,H);const id=x.getImageData(0,0,W,H),p=id.data,g=new Uint8Array(W*H);
 for(let i=0;i<W*H;i++)g[i]=(p[4*i]*.299+p[4*i+1]*.587+p[4*i+2]*.114)|0;
 const I=new Uint32Array((W+1)*(H+1));
 for(let y=0;y<H;y++){let s=0;for(let k=0;k<W;k++){s+=g[y*W+k];I[(y+1)*(W+1)+k+1]=I[y*(W+1)+k+1]+s}}
 const r=Math.round(W/60),b=new Uint8Array(W*H);
 for(let y=0;y<H;y++){const y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);for(let k=0;k<W;k++){
  const x0=Math.max(0,k-r),x1=Math.min(W,k+r+1),m=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/((x1-x0)*(y1-y0));
  b[y*W+k]=g[y*W+k]<m-18?1:0}}
 const o=new Uint8Array(b),hl=Math.round(W*.03),vl=Math.round(W*.02);
 for(let y=0;y<H;y++){let s=-1;for(let k=0;k<=W;k++){const v=k<W&&b[y*W+k];if(v&&s<0)s=k;if(!v&&s>=0){if(k-s>=hl)for(let q=s;q<k;q++)o[y*W+q]=0;s=-1}}}
 for(let k=0;k<W;k++){let s=-1;for(let y=0;y<=H;y++){const v=y<H&&b[y*W+k];if(v&&s<0)s=y;if(!v&&s>=0){if(y-s>=vl)for(let q=s;q<y;q++)o[q*W+k]=0;s=-1}}}
 for(let i=0;i<W*H;i++){const v=o[i]?0:255;p[4*i]=p[4*i+1]=p[4*i+2]=v;p[4*i+3]=255}
 x.putImageData(id,0,0);return c}

let phase=1;
async function runOCR(){
 phase=1;
 $('#bGo').disabled=$('#bRe').disabled=true;
 try{
  stat(.02,'Menyiapkan gambar…');const cv=prep(img);
  const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(phase!==1)return;if(m.status==='recognizing text')stat(.1+m.progress*.6,'Membaca teks… '+Math.round(m.progress*100)+'%');else stat(.08,'Memuat OCR (butuh internet pertama kali)…')}});
  await w.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});
  const r=await w.recognize(cv);
  const ws=r.data.words.filter(x=>x.text.trim()).map(x=>({t:x.text.trim(),c:x.confidence,x0:x.bbox.x0/cv.width,x1:x.bbox.x1/cv.width,y:(x.bbox.y0+x.bbox.y1)/2/cv.width}));
  ws.forEach(x=>x.x=(x.x0+x.x1)/2);
  const res=parse(ws);
  if(res.ok){phase=2;try{await refine(w,cv,res)}catch(e){console.warn('refine',e)}}
  await w.terminate();
  if(res.ok){S.ocr=res.rows;save();rOcr();stat(1,'Selesai. Periksa hasil, terutama sel kuning.')}
  else stat(1,res.msg);
  readInfo(ws);
 }catch(e){stat(0,'Gagal: '+(e.message||e)+'. Cek koneksi internet lalu coba lagi.')}
 $('#bGo').disabled=$('#bRe').disabled=false;
}

/* ---------- Parser tabel berbasis koordinat ---------- */
const DICT=['SKGA','SKKA','SSTK','SKSJ','IHBK','IHJR','IHAG','IHSJ','RAKD','RAKN','RGSD','RGSN','RGSA 120','RGAP 120','RGBS 120','RGKR 120','RGAB 120','RGSO 120','GSSJ','GAPJ','ISBL','ISLR','ISR','ISB','GS','GPD','GRS','GCIR','KA','SM','ICM','IMGA','IRPM','MKPN','MKGSN','KBGN','RBS','RGA','RISN','PGSS','PGSL','PGSSJ','PGSSS','RGPKD','PMPJ','MTLS'];
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function fix(s){ /* koreksi ke daftar kode dikenal hanya jika ada satu kandidat berjarak 1 */
 if(DICT.includes(s))return[s,0];
 const c=DICT.filter(k=>lev(s,k)===1);return c.length===1?[c[0],1]:[s,1]}
function roman(t){t=t.toUpperCase().replace(/[L1|!]/g,'I');return ROM.indexOf(t)}
function parse(ws){
 const nm=w=>w.t.replace(/[^A-Za-z]/g,'');
 const fl=ws.filter(w=>/^flavou?r$/i.test(nm(w))),op=ws.filter(w=>/^output$/i.test(nm(w)));
 /* 1. label Line (kolom kiri) */
 let m=ws.filter(w=>/^l[il1|]ne/i.test(w.t));
 if(m.length<3)return{ok:false,msg:'Label "Line" kurang terbaca ('+m.length+'). Foto ulang lebih lurus & terang, atau isi manual.'};
 const mx=m.map(w=>w.x).sort((a,b)=>a-b)[Math.floor(m.length/2)];
 let lab=m.filter(w=>Math.abs(w.x-mx)<.05).sort((a,b)=>a.y-b.y);
 lab=lab.filter((w,i)=>!i||w.y-lab[i-1].y>.012);
 ws.filter(w=>/^[IVXl1|]{1,4}$/.test(w.t)&&w.x>mx+.008&&w.x<mx+.05&&roman(w.t)>0&&!lab.some(l=>Math.abs(l.y-w.y)<.012)).forEach(w=>lab.push({...w,t:'Line'+w.t}));
 lab.sort((a,b)=>a.y-b.y);
 let hy=fl.length?Math.max(...fl.filter(w=>w.y<lab[Math.min(2,lab.length-1)].y).map(w=>w.y),0):0;
 if(hy)lab=lab.filter(l=>l.y>hy+.01);else if(lab.length>11)lab.shift();
 if(lab.length<3)return{ok:false,msg:'Baris Line kurang terbaca. Foto ulang atau isi manual.'};
  const lx=Math.max(...lab.map(l=>l.x1))+.015;
 /* 2. kolom Flavour: dari header; cadangan: klaster posisi X kode huruf */
 let cen,d;
 const my=fl.length?Math.min(...fl.map(w=>w.y)):0,h=fl.filter(w=>w.y<my+.03).sort((a,b)=>a.x-b.x).slice(0,3);
 if(h.length===3){cen=h.map(w=>w.x);const ds=h.map(f=>{const o=op.filter(o=>o.x>f.x&&Math.abs(o.y-f.y)<.03).sort((a,b)=>a.x-b.x)[0];return o?o.x-f.x:0}).filter(Boolean);
  d=ds.length?ds.reduce((a,b)=>a+b)/ds.length:(cen[1]-cen[0])*.27}
 else{
  const xs=ws.filter(w=>w.x0>lx&&w.y>lab[0].y-.01&&w.y<lab[lab.length-1].y+.03&&/^[A-Z]{2,7}$/.test(w.t)).map(w=>w.x).sort((a,b)=>a-b);
  if(xs.length<4)return{ok:false,msg:'Kolom Flavour tidak terdeteksi. Foto ulang atau isi manual.'};
  cen=[xs[0],(xs[0]+xs[xs.length-1])/2,xs[xs.length-1]];
  for(let it=0;it<12;it++){const g=[[],[],[]];xs.forEach(v=>g[cen.map(c=>Math.abs(c-v)).indexOf(Math.min(...cen.map(c=>Math.abs(c-v))))].push(v));
   cen=g.map((a,i)=>a.length?a.reduce((x,y)=>x+y)/a.length:cen[i])}
  d=(cen[2]-cen[0])/2*.27}
 /* nomor Line dari angka romawi, lalu cocokkan ke grid baris yang jaraknya teratur (tahan label yang hilang/salah baca) */
 const med=a=>a.slice().sort((x,y)=>x-y)[Math.floor(a.length/2)],known=[];
 lab.forEach(L=>{let n=0;const mm=L.t.match(/^l[il1|]ne([ivxl1|]+)$/i);if(mm)n=roman(mm[1]);
  if(!n){const r=ws.filter(w=>w.x0>=L.x1-.01&&w.x1<lx+.02&&Math.abs(w.y-L.y)<.012&&roman(w.t)>0).sort((a,b)=>a.x-b.x)[0];if(r)n=roman(r.t)}
  if(n)known.push({n,y:L.y})});
 let p,y0;
 if(known.length>=2){const ps=[];known.forEach(a=>known.forEach(b=>{if(b.n>a.n)ps.push((b.y-a.y)/(b.n-a.n))}));p=med(ps);y0=med(known.map(k=>k.y-(k.n-1)*p))}
 else{p=med(lab.slice(1).map((w,i)=>w.y-lab[i].y));y0=lab[0].y}
 lab=Array.from({length:11},(_,i)=>({n:i+1,y:y0+i*p}));
 /* 3. petakan kata ke sel (Line, Shift) */
 const rows=emptyOcr(),cells={};
 ws.forEach(w=>{
  const j=cen.findIndex(c=>Math.abs(w.x-c)<d*.55);if(j<0)return;
  if(/^flavou?r$/i.test(nm(w)))return;
  if(w.c<30&&!DICT.includes(w.t.toUpperCase()))return;
  if(w.y<lab[0].y-p*.5||w.y>lab[lab.length-1].y+p)return;
  let L=null;lab.forEach(l=>{if(l.y<=w.y+p*.3)L=l});if(!L)return;
  (cells[L.n+'_'+j]=cells[L.n+'_'+j]||[]).push(w)});
 Object.entries(cells).forEach(([k,list])=>{
  const[n,j]=k.split('_').map(Number),row=rows.find(r=>r.n===n);if(!row)return;
  list.sort((a,b)=>a.y-b.y);const lines=[];
  list.forEach(w=>{const l=lines.find(l=>Math.abs(l.y-w.y)<p*.3);if(l)l.w.push(w);else lines.push({y:w.y,w:[w]})});
  let un=false;const codes=[];
  lines.forEach(l=>{l.w.sort((a,b)=>a.x-b.x);
   const ts=l.w.map(w=>w.t.toUpperCase().replace(/[^A-Z0-9]/g,'')).filter(t=>t.length>1);
   if(!ts.length||/^\d+$/.test(ts[0]))return;
   let s=ts.join(' ').replace(/^([A-Z]{2,7})(\d{2,3})$/,'$1 $2').replace(/^(\S+)/,q=>/[A-Z]/.test(q)?q.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S'):q);
   if(!s)return;
   const parts=s.split(' ');if(parts.length>1&&!/^\d{2,3}$/.test(parts[parts.length-1]))s=parts.reduce((a,b)=>b.length>a.length?b:a);
   const lowc=Math.min(...l.w.map(w=>w.c))<60,[f,c]=fix(s);
   if(c||lowc)un=true;codes.push(f)});
  row.s[j]={t:[...new Set(codes)].join('/'),u:un?1:0}});
 return{ok:true,rows,cen,d,lab,p}}

/* Tahap 2: baca ulang setiap sel Flavour satu per satu (jauh lebih akurat daripada satu halaman penuh) */
const clean=s=>{s=s.toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^([A-Z]{2,7})(\d{2,3})$/,'$1 $2');
 let t=s.split(' ').filter(q=>q.length>1);while(t.length&&/^\d+$/.test(t[0]))t.shift();s=t.join(' ');t=s.split(' ');if(t.length>1&&!/^\d{2,3}$/.test(t[t.length-1]))s=t.reduce((a,b)=>b.length>a.length?b:a);
 return s.replace(/^(\S+)/,q=>/[A-Z]/.test(q)?q.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S'):q)};
async function refine(w,cv,res){
 const{cen,d,lab,p}=res,W=cv.width,x=cv.getContext('2d',{willReadFrequently:true}),tot=lab.length*3;let k=0;
 await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 '});
 for(const L of lab)for(let j=0;j<3;j++){
  stat(.7+.29*(k++/tot),'Memeriksa sel '+k+'/'+tot+'…');
  const x0=Math.max(0,Math.round((cen[j]-d*.5)*W)),x1=Math.min(W,Math.round((cen[j]+d*.6)*W)),y0=Math.max(0,Math.round((L.y-.3*p)*W)),y1=Math.min(cv.height,Math.round((L.y+.75*p)*W)),cw=x1-x0,ch=y1-y0;
  if(cw<10||ch<10)continue;
  const px=x.getImageData(x0,y0,cw,ch).data;let ink=0;for(let i=0;i<px.length;i+=4)if(px[i]<128)ink++;
  const cell=res.rows[L.n-1].s[j];
  if(ink/(cw*ch)<.006){cell.t='';cell.u=0;continue}
  const t=document.createElement('canvas');t.width=cw+60;t.height=ch+60;const tx=t.getContext('2d');tx.fillStyle='#fff';tx.fillRect(0,0,t.width,t.height);tx.drawImage(cv,x0,y0,cw,ch,30,30,cw,ch);
  const r=await w.recognize(t),codes=[];let un=false;
  r.data.text.split('\n').forEach(l=>{const s=clean(l);if(s.length<2||/^\d+$/.test(s))return;const[f,c]=fix(s);if(c)un=true;if(!codes.includes(f))codes.push(f)});
  const a=codes.join('/'),b=cell.t,ok=q=>!!q&&q.split('/').every(c=>DICT.includes(c)),rt=ink/(cw*ch);
  if(a&&!un){cell.t=a;cell.u=0}else if(ok(b)){cell.u=0}else if(a){cell.t=a;cell.u=1}else if(b){cell.u=1}else{cell.t='';cell.u=rt>.02?1:0}}}

function readInfo(ws){
 const dt=ws.find(w=>/^\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4}$/.test(w.t));if(dt)S.info.date=dt.t;
 const dy=ws.find(w=>/^(senin|selasa|rabu|kamis|jumat|sabtu|minggu)$/i.test(w.t.replace(/[^A-Za-z]/g,'')));
 if(dy){const t=dy.t.replace(/[^A-Za-z]/g,'');S.info.day=t[0].toUpperCase()+t.slice(1).toLowerCase()}
 const nm=ws.find(w=>/^(nomer|nomor)/i.test(w.t));
 if(nm){const n=ws.filter(w=>/^\d{2,5}$/.test(w.t)&&w.x>nm.x&&Math.abs(w.y-nm.y)<.02).sort((a,b)=>a.x-b.x)[0];if(n)S.info.no=n.t}
 $('#iDay').value=S.info.day;$('#iDate').value=S.info.date;$('#iNo').value=S.info.no;save()}

/* ---------- Buku digital ---------- */
function rBook(){
 const cols=vis();
 $('#bookBox').innerHTML=[0,1,2].map(s=>`<div class="shift"><h3>SHIFT ${s+1}</h3><div class="sc"><table><thead><tr><th>${esc(S.cfg.lt)}</th><th>${esc(S.cfg.ft)}</th>${cols.map(c=>`<th>${esc(c.t)}</th>`).join('')}<th></th></tr></thead><tbody>
 ${S.book[s].map((r,i)=>`<tr><td><input data-s="${s}" data-i="${i}" data-k="n" value="${esc(r.n)}" style="min-width:50px"></td><td><input data-s="${s}" data-i="${i}" data-k="f" value="${esc(r.f)}" style="min-width:110px"></td>${cols.map(c=>`<td><input data-s="${s}" data-i="${i}" data-k="${c.id}" value="${esc(r.v[c.id])}"></td>`).join('')}<td><button data-del="${s}_${i}">✕</button></td></tr>`).join('')}
 </tbody></table></div><div class="row"><button data-add="${s}">+ Baris</button></div></div>`).join('')}
$('#bookBox').oninput=e=>{const t=e.target.dataset;if(t.k==null)return;const r=S.book[t.s][t.i];if(t.k==='n'||t.k==='f')r[t.k]=e.target.value;else r.v[t.k]=e.target.value;save()};
$('#bookBox').onclick=e=>{const t=e.target.dataset;
 if(t.add!=null){S.book[t.add].push({n:'',f:'',v:{}});}
 else if(t.del!=null){const[s,i]=t.del.split('_');S.book[s].splice(i,1)}else return;save();rBook()};

/* ---------- Pengaturan kolom ---------- */
function rSet(){const c=S.cfg;
 $('#setBox').innerHTML=`<div class="sr" style="grid-template-columns:1fr 1fr"><input data-f="lt" value="${esc(c.lt)}" aria-label="Judul kolom Line"><input data-f="ft" value="${esc(c.ft)}" aria-label="Judul kolom Flavour"></div><p class="hint">Setiap kolom: tampil, judul, nilai awal, naik, turun, hapus.</p>`+
 c.cols.map((k,i)=>`<div class="sr"><input type="checkbox" data-i="${i}" data-f="on" ${k.on?'checked':''} style="width:22px"><input data-i="${i}" data-f="t" value="${esc(k.t)}"><input data-i="${i}" data-f="d" value="${esc(k.d)}" placeholder="awal"><button data-up="${i}">↑</button><button data-dn="${i}">↓</button><button data-rm="${i}">✕</button></div>`).join('')}
$('#setBox').oninput=e=>{const t=e.target,f=t.dataset.f;if(!f)return;if(t.dataset.i==null)S.cfg[f]=t.value;else S.cfg.cols[t.dataset.i][f]=f==='on'?(t.checked?1:0):t.value;save()};
$('#setBox').onclick=e=>{const t=e.target.dataset,a=S.cfg.cols;
 if(t.up!=null&&+t.up>0){const i=+t.up;[a[i-1],a[i]]=[a[i],a[i-1]]}
 else if(t.dn!=null&&+t.dn<a.length-1){const i=+t.dn;[a[i+1],a[i]]=[a[i],a[i+1]]}
 else if(t.rm!=null){if(confirm('Hapus kolom ini?'))a.splice(+t.rm,1)}else return;save();rSet()};
$('#bAdd').onclick=()=>{S.cfg.cols.push({id:'c'+Date.now(),t:'Kolom baru',d:'',on:1});save();rSet()};
$('#bSet').onclick=()=>{rSet();$('#dSet').showModal()};
$('#bSetOk').onclick=()=>{$('#dSet').close();rBook();rPrev()};
$('#bClear').onclick=()=>{if(confirm('Hapus semua data (hasil OCR, buku digital, info jadwal)? Pengaturan kolom tetap disimpan.')){const c=S.cfg;S=fresh();S.cfg=c;save();location.reload()}};

/* ---------- Ekspor (digambar langsung ke canvas) ---------- */
function pages(){
 const W=1240,H=1754,M=60,RH=48,cols=vis(),pgs=[];let cv,g,y;
 const cw=cols.length?(W-2*M-440)/cols.length:0,wd=[110,330,...cols.map(()=>cw)],hd=[S.cfg.lt,S.cfg.ft,...cols.map(c=>c.t)];
 const np=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#111');gr.addColorStop(1,'#c9a227');g.fillStyle=gr;g.fillRect(0,0,W,110);
  g.textBaseline='middle';g.textAlign='left';g.fillStyle='#fff';g.font='bold 46px sans-serif';g.fillText('FINISH GOOD ANALYSIS',M,56);
  g.fillStyle='#111';g.font='28px sans-serif';g.fillText('Hari/Tanggal: '+(S.info.day+' '+S.info.date).trim(),M,152);g.textAlign='right';g.fillText('No. Jadwal: '+S.info.no,W-M,152);
  pgs.push(cv);y=195};
 const row=(a,head)=>{let x=M;a.forEach((t,i)=>{const w=wd[i];if(head){g.fillStyle='#111';g.fillRect(x,y,w,RH)}
  g.strokeStyle='#999';g.lineWidth=1.5;g.strokeRect(x,y,w,RH);g.fillStyle=head?'#f5d76e':'#111';let s=28;g.textAlign='center';
  do{g.font=(head?'bold ':'')+s+'px sans-serif';s-=2}while(g.measureText(t).width>w-14&&s>12);g.fillText(String(t??''),x+w/2,y+RH/2+2);x+=w});y+=RH};
 np();
 S.book.forEach((rows,s)=>{
  const bar=c=>{if(y+RH*3>H-M-30)np();g.fillStyle='#c9a227';g.fillRect(M,y,W-2*M,RH);g.fillStyle='#111';g.font='bold 30px sans-serif';g.textAlign='left';g.fillText('SHIFT '+(s+1)+(c?' (lanjutan)':''),M+14,y+RH/2);y+=RH;row(hd,1)};
  bar(0);rows.forEach(r=>{if(y+RH>H-M-30){np();bar(1)}row([r.n,r.f,...cols.map(c=>r.v[c.id]||'')],0)});y+=34});
 if(pgs.length>1)pgs.forEach((c,i)=>{const k=c.getContext('2d');k.fillStyle='#555';k.font='24px sans-serif';k.textAlign='center';k.textBaseline='middle';k.fillText('Halaman '+(i+1)+' / '+pgs.length,W/2,H-35)});
 return pgs}
function rPrev(){const b=$('#prev');b.innerHTML='';pages().forEach(c=>b.appendChild(c))}
const blobs=cs=>Promise.all(cs.map(c=>new Promise(r=>c.toBlob(r,'image/png'))));
const fname=()=>'FinishGood_'+(S.info.date||'jadwal').replace(/[^\w-]/g,'-');
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#bPng').onclick=async()=>{const bs=await blobs(pages());bs.forEach((b,i)=>setTimeout(()=>dl(b,fname()+(bs.length>1?'_h'+(i+1):'')+'.png'),i*400))};
$('#bShare').onclick=async()=>{const bs=await blobs(pages()),fs=bs.map((b,i)=>new File([b],fname()+'_'+(i+1)+'.png',{type:'image/png'}));
 if(navigator.canShare&&navigator.canShare({files:fs})){try{await navigator.share({files:fs,title:'Finish Good Analysis'})}catch(e){}}
 else{alert('Perangkat tidak mendukung berbagi langsung. Gambar diunduh, silakan kirim lewat WhatsApp.');bs.forEach((b,i)=>dl(b,fname()+'_'+(i+1)+'.png'))}};
$('#bPrint').onclick=()=>{const im=pages().map(c=>'<img src="'+c.toDataURL('image/jpeg',.92)+'">').join(''),w=window.open('');
 w.document.write('<style>@page{size:A4;margin:0}body{margin:0}img{width:100%;display:block;page-break-after:always}</style>'+im);w.document.close();setTimeout(()=>w.print(),600)};
$('#bPdf').onclick=()=>{const cs=pages(),enc=new TextEncoder(),parts=[],off=[];let len=0;
 const add=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);len+=b.length};
 add('%PDF-1.4\n');off[1]=len;add('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
 off[2]=len;add('2 0 obj\n<</Type/Pages/Count '+cs.length+'/Kids['+cs.map((_,k)=>(3+3*k)+' 0 R').join(' ')+']>>\nendobj\n');
 cs.forEach((c,k)=>{const bin=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),jb=Uint8Array.from(bin,x=>x.charCodeAt(0)),a=3+3*k,ct='q 595 0 0 842 0 0 cm /Im0 Do Q';
  off[a]=len;add(a+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(a+2)+' 0 R>>>>/Contents '+(a+1)+' 0 R>>\nendobj\n');
  off[a+1]=len;add((a+1)+' 0 obj\n<</Length '+ct.length+'>>\nstream\n'+ct+'\nendstream\nendobj\n');
  off[a+2]=len;add((a+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+c.width+'/Height '+c.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jb.length+'>>\nstream\n');add(jb);add('\nendstream\nendobj\n')});
 const n=3+3*cs.length,xr=len;let x='xref\n0 '+n+'\n0000000000 65535 f \n';for(let i=1;i<n;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 add(x+'trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');dl(new Blob(parts,{type:'application/pdf'}),fname()+'.pdf')};

rOcr();
if('serviceWorker'in navigator){
 const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});
 addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(r=>r.update()).catch(()=>{}))}

</script>
